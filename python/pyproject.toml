[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expresso-framework"
version = "0.0.2"
authors = [
  { name="Jaeho Choi", email="jhc.jaehochoi@gmail.com" },
]
description = "Expresso is a lightweight exposure and diagnostic framework built around a 2D filtering matrix."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICEN[CS]E*"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/JaehoChoi00/Expresso"
Repository = "https://github.com/JaehoChoi00/Expresso"
Issues = "https://github.com/JaehoChoi00/Expresso/issues"